[tools]
odin = "dev-2026-05"
watchexec = "latest"

# os() resolves at parse time; $(odin root) at runtime so it uses mise's pinned odin.
[env]
OUT_DIR = "build/hot_reload"
EXE = "app_hot_reload.bin"
DLL_EXT = "{% if os() == 'macos' %}.dylib{% else %}.so{% endif %}"

[tasks.build-app]
description = "Compile source/ into a reloadable app DLL (triggers a live hot reload)"
alias = "reload"
sources = ["source/*.odin"]
outputs = ["{{ env.OUT_DIR }}/app{{ env.DLL_EXT }}"]
run = [
  "mkdir -p $OUT_DIR",
  "{% if os() == 'linux' %}mkdir -p $OUT_DIR/linux && cp -rn $(odin root)/vendor/raylib/linux/libraylib*.so* $OUT_DIR/linux{% else %}true{% endif %}",
  "odin build source -extra-linker-flags:\"{% if os() == 'macos' %}-Wl,-rpath $(odin root)/vendor/raylib/macos{% else %}'-Wl,-rpath=$ORIGIN/linux'{% endif %}\" -define:RAYLIB_SHARED=true -build-mode:dll -out:$OUT_DIR/app_tmp$DLL_EXT -strict-style -vet -debug",
  # atomic swap — never load a half-written DLL
  "mv $OUT_DIR/app_tmp$DLL_EXT $OUT_DIR/app$DLL_EXT",
]

[tasks.build-exe]
description = "Compile the hot-reload host executable"
sources = ["source/main_hot_reload/*.odin"]
outputs = ["{{ env.OUT_DIR }}/{{ env.EXE }}"]
run = [
  "mkdir -p $OUT_DIR",
  "odin build source/main_hot_reload -out:$OUT_DIR/$EXE -strict-style -vet -debug",
  # symlink so assets/ is reachable by relative path (exe chdirs to its own dir)
  "rm -rf $OUT_DIR/assets && ln -s ../../assets $OUT_DIR/assets",
]

# App runs foreground — backgrounding a GUI app trips SIGTTOU/HUP and freezes the window.
# Watcher runs in the background; trap kills it on exit so it doesn't keep rebuilding.
[tasks.dev]
description = "Build + run with automatic hot reload (watches source/)"
depends = ["build-app", "build-exe"]
run = '''
watchexec --watch source --exts odin --debounce 200ms -- mise run build-app &
watcher=$!
# kill watcher; remove numbered DLL copies left behind by unclean exits
trap 'kill $watcher 2>/dev/null; rm -f "$OUT_DIR"/app_*.dylib' EXIT INT TERM
./"$OUT_DIR/$EXE"
'''

[tasks.run]
description = "Build + run the standalone (non-hot-reload) app"
alias = "r"
run = [
  "mkdir -p build/debug",
  "odin build source/main_release -out:build/debug/plastella.bin -strict-style -vet",
  "rm -rf build/debug/assets && ln -s ../../assets build/debug/assets",
  "./build/debug/plastella.bin",
]

[tasks.build]
description = "Build an optimized release into build/release/"
alias = "b"
sources = ["source/*.odin", "source/main_release/*.odin", "assets/**/*"]
outputs = ["build/release/plastella.bin"]
run = [
  "rm -rf build/release",
  "mkdir -p build/release",
  "odin build source/main_release -out:build/release/plastella.bin -strict-style -vet -no-bounds-check -o:speed",
  "cp -R assets build/release/",
]

[tasks.stop]
description = "Kill the running hot-reload app and clean up per-reload DLL copies"
run = '''
pkill -f "$EXE" || true
rm -f "$OUT_DIR"/app_*.dylib
'''

[tasks.clean]
description = "Delete build artifacts, binaries, and logs"
run = "rm -rf build log.txt"
