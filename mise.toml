[tools]
odin = "dev-2026-07a"
watchexec = "latest"
# cmake + ninja exist only to build the vendored SDL3 (scripts/vendor-sdl.sh)
cmake = "latest"
ninja = "latest"

# Per-OS strings resolve once here at load time; tasks and scripts reference them by name.
[env]
APP_NAME = "plastella"
HR_OUT = "build/hot_reload"
EXE = "app-hr.bin"
SDL_VERSION = "3.4.12"
# Satellite libs to vendor, "<name>:<version>" — expands to repo SDL_<name>, tarball
# SDL3_<name>, cmake -DSDL<NAME>_VENDORED=ON. Add one here and rerun `mise run setup`;
# no linker flags to touch (Odin's `foreign import "system:SDL3_<name>"` emits the -l).
SDL_SATELLITES = "ttf:3.2.2 image:3.4.4"
SDL_DIR = "vendor/sdl3/{% if os() == 'macos' %}macos{% else %}linux{% endif %}"
DLL_EXT = "{% if os() == 'macos' %}.dylib{% else %}.so{% endif %}"
# find + rpath the SDL3 libs staged next to the binary; $ORIGIN stays literal — the loader resolves it
SDL_LDFLAGS = "{% if os() == 'macos' %}-L{{ config_root }}/{{ env.SDL_DIR }} -Wl,-rpath,@loader_path{% else %}-L{{ config_root }}/{{ env.SDL_DIR }} -Wl,-rpath=$ORIGIN{% endif %}"
# standalone executables additionally embed Info.plist on macOS
EXE_LDFLAGS = "{{ env.SDL_LDFLAGS }}{% if os() == 'macos' %} -sectcreate __TEXT __info_plist Info.plist{% endif %}"
# the SDL3 + SDL3_ttf shared libs to stage next to built binaries
SDL_GLOB = "{% if os() == 'macos' %}libSDL3*.dylib{% else %}libSDL3*.so*{% endif %}"

[tasks.setup]
description = "Build the vendored SDL3 + satellite shared libs (run once, or after a version bump)"
# mise.toml as a source so editing SDL_SATELLITES / SDL_VERSION re-runs the vendor script
sources = ["mise.toml"]
outputs = ["{{ env.SDL_DIR }}/.stamp"]
run = "bash scripts/vendor-sdl.sh"

[tasks.build-app]
description = "Compile source/ into a reloadable app DLL (triggers a live hot reload)"
alias = "reload"
depends = ["setup"]
# every package the app dll pulls in — glob so new packages don't need a manual add
sources = ["source/**/*.odin", "!source/host/*.odin"]
outputs = ["{{ env.HR_OUT }}/{{ env.APP_NAME }}{{ env.DLL_EXT }}"]
run = "bash scripts/build-app.sh"

[tasks.build-host]
description = "Compile the hot-reload host executable"
sources = ["source/host/*.odin"]
outputs = ["{{ env.HR_OUT }}/{{ env.EXE }}"]
run = "bash scripts/build-host.sh"

[tasks.dev]
description = "Build + run with automatic hot reload (watches source/)"
depends = ["build-app", "build-host"]
run = "bash scripts/dev.sh"

[tasks."dev:debug"]
description = "Same as dev, but under lldb — prints a symbolized backtrace on a crash"
depends = ["build-app", "build-host"]
env = { LLDB = "1" }
run = "bash scripts/dev.sh"

[tasks.run]
description = "Build + run the standalone (non-hot-reload) app"
alias = "r"
depends = ["setup"]
run = "bash scripts/run-debug.sh"

[tasks.build]
description = "Build an optimized release into build/release/"
alias = "b"
depends = ["setup"]
sources = ["source/**/*.odin", "resources/**/*"]
outputs = ["build/release/{{ env.APP_NAME }}.bin"]
run = "bash scripts/build-release.sh"

[tasks.stop]
description = "Kill the running hot-reload app and clean up per-reload DLL copies"
run = '''
pkill -f "$EXE" || true
rm -f "$HR_OUT"/${APP_NAME}_[0-9]*$DLL_EXT
'''
