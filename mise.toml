[tools]
odin = "dev-2026-07a"
watchexec = "latest"
# SDL3 has no committable prebuilt lib (macOS ships a .dmg, Linux is source-only),
# so we build it from source. cmake + ninja are the only extra tools that needs.
cmake = "latest"
ninja = "latest"

# os() resolves at parse time; $(odin root) at runtime so it uses mise's pinned odin.
[env]
APP_NAME = "plastella"
HR_OUT = "build/hot_reload"
EXE = "app-hr.bin"
DLL_EXT = "{% if os() == 'macos' %}.dylib{% elif os() == 'windows' %}.dll{% else %}.so{% endif %}"
# SDL3 built from source by `mise run setup` into a per-OS vendor dir, like vendor/clay.
SDL_VERSION = "3.4.12"
# SDL_ttf is a separate repo/release; built from source with vendored freetype+harfbuzz.
SDL_TTF_VERSION = "3.2.2"
SDL_DIR = "vendor/sdl3/{% if os() == 'macos' %}macos{% elif os() == 'windows' %}windows{% else %}linux{% endif %}"

# Build SDL3 from source into $SDL_DIR. Idempotent: skips when the stamp exists.
# Windows also needs a C toolchain (MSVC/clang) on PATH; cmake+ninja are provided by mise.
[tasks.setup]
description = "Build the vendored SDL3 shared library (run once, or after bumping SDL_VERSION)"
outputs = ["{{ env.SDL_DIR }}/.stamp"]
run = '''
set -e
if [ -f "$SDL_DIR/.stamp" ]; then echo "SDL3 $SDL_VERSION already vendored in $SDL_DIR"; exit 0; fi
mkdir -p "$SDL_DIR" build/.sdl
cd build/.sdl
rm -rf inst

# fetch a libsdl-org release, cmake-build it, install into the shared `inst` prefix.
# args: <repo> <src-name> <version> [extra cmake flags...]. CMAKE_PREFIX_PATH=inst lets
# each build find the ones installed before it (SDL_ttf needs the SDL3 we build first).
vendor() {
  repo=$1; name=$2; ver=$3; shift 3
  tb="$name-$ver.tar.gz"
  [ -f "$tb" ] || curl -fL -o "$tb" "https://github.com/libsdl-org/$repo/releases/download/release-$ver/$tb"
  rm -rf "$name-$ver" "b-$name"
  tar xf "$tb"
  cmake -S "$name-$ver" -B "b-$name" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/inst" "$@"
  cmake --build "b-$name"
  cmake --install "b-$name" --prefix inst
}

vendor SDL     SDL3     "$SDL_VERSION"     -DSDL_SHARED=ON -DSDL_STATIC=OFF
# SDLTTF_VENDORED bundles freetype+harfbuzz so there are no system deps.
vendor SDL_ttf SDL3_ttf "$SDL_TTF_VERSION" -DBUILD_SHARED_LIBS=ON -DSDLTTF_VENDORED=ON

cd ../..
# copy shared libs (+ import libs + version symlinks) flat into the vendor dir; cp -a keeps symlinks.
# libSDL3*.dylib / SDL3*.dll / libSDL3*.so* patterns catch both SDL3 and SDL3_ttf.
find build/.sdl/inst \( -name 'libSDL3*.so*' -o -name 'libSDL3*.dylib' -o -name 'SDL3*.dll' -o -name 'SDL3*.lib' \) -exec cp -a {} "$SDL_DIR/" \;
touch "$SDL_DIR/.stamp"
echo "vendored SDL3 $SDL_VERSION + SDL3_ttf $SDL_TTF_VERSION -> $SDL_DIR"
'''

[tasks.build-app]
description = "Compile source/ into a reloadable app DLL (triggers a live hot reload)"
alias = "reload"
depends = ["setup"]
# every package the app dll pulls in — glob so new packages don't need a manual add
sources = ["source/**/*.odin", "!source/host/*.odin"]
# must match the name source/app/app.odin load()s at runtime
outputs = ["{{ env.HR_OUT }}/{{ env.APP_NAME }}{{ env.DLL_EXT }}"]
run = [
  "mkdir -p $HR_OUT",
  # stage the SDL3 shared lib next to the dll so its rpath (@loader_path / $ORIGIN) resolves at load time
  "{% if os() == 'macos' %}cp -a $SDL_DIR/libSDL3*.dylib $HR_OUT/{% elif os() == 'windows' %}cp $SDL_DIR/SDL3*.dll $HR_OUT/{% else %}cp -a $SDL_DIR/libSDL3*.so* $HR_OUT/{% endif %}",
  # compile to a temp name first...
  # \$ORIGIN must stay escaped so the shell doesn't expand it — the linker resolves it at load time (dll-relative)
  "odin build source/app -extra-linker-flags:\"{% if os() == 'windows' %}/LIBPATH:$SDL_DIR{% elif os() == 'macos' %}-L$PWD/$SDL_DIR -Wl,-rpath,@loader_path{% else %}-L$PWD/$SDL_DIR -Wl,-rpath=\\$ORIGIN{% endif %}\" -build-mode:dll -out:$HR_OUT/${APP_NAME}_tmp$DLL_EXT -strict-style -vet -debug",
  # ...then atomic-rename so the host never loads a half-written dll
  "mv $HR_OUT/${APP_NAME}_tmp$DLL_EXT $HR_OUT/$APP_NAME$DLL_EXT",
]

[tasks.build-host]
description = "Compile the hot-reload host executable"
sources = ["source/host/*.odin"]
outputs = ["{{ env.HR_OUT }}/{{ env.EXE }}"]
# host links no SDL (it only dlopen's the app dll); libSDL3 is staged into $HR_OUT by build-app
run = [
  "mkdir -p $HR_OUT",
  "odin build source/host -out:$HR_OUT/$EXE{% if os() == 'macos' %} -extra-linker-flags:\"-sectcreate __TEXT __info_plist Info.plist\"{% endif %} -strict-style -vet -debug",
  # symlink so resources/ is reachable by relative path (exe chdirs to its own dir)
  "rm -rf $HR_OUT/resources && ln -s ../../resources $HR_OUT/resources",
]

# App runs foreground — backgrounding a GUI app trips SIGTTOU/HUP and freezes the window.
# Watcher runs in the background; trap kills it on exit so it doesn't keep rebuilding.
[tasks.dev]
description = "Build + run with automatic hot reload (watches source/)"
depends = ["build-app", "build-host"]
run = '''
watchexec --watch source --exts odin --debounce 200ms -- mise run build-app &
watcher=$!
# kill watcher; remove numbered DLL copies left behind by unclean exits
trap 'kill $watcher 2>/dev/null; rm -f "$HR_OUT"/${APP_NAME}_[0-9]*$DLL_EXT' EXIT INT TERM
# run from $HR_OUT (subshell) so the host finds plastella.dylib + resources/ by relative path
(cd "$HR_OUT" && ./"$EXE")
'''

[tasks.run]
description = "Build + run the standalone (non-hot-reload) app"
alias = "r"
depends = ["setup"]
run = [
  "mkdir -p build/debug",
  # stage SDL3 next to the exe so its rpath finds it
  "{% if os() == 'macos' %}cp -a $SDL_DIR/libSDL3*.dylib build/debug/{% elif os() == 'windows' %}cp $SDL_DIR/SDL3*.dll build/debug/{% else %}cp -a $SDL_DIR/libSDL3*.so* build/debug/{% endif %}",
  "odin build source/release -out:build/debug/$APP_NAME.bin -extra-linker-flags:\"{% if os() == 'windows' %}/LIBPATH:$SDL_DIR{% elif os() == 'macos' %}-L$PWD/$SDL_DIR -Wl,-rpath,@loader_path -sectcreate __TEXT __info_plist Info.plist{% else %}-L$PWD/$SDL_DIR -Wl,-rpath=\\$ORIGIN{% endif %}\" -strict-style -vet",
  "rm -rf build/debug/resources && ln -s ../../resources build/debug/resources",
  "./build/debug/$APP_NAME.bin",
]

[tasks.build]
description = "Build an optimized release into build/release/"
alias = "b"
depends = ["setup"]
sources = ["source/**/*.odin", "resources/**/*"]
outputs = ["build/release/{{ env.APP_NAME }}.bin"]
run = [
  "rm -rf build/release",
  "mkdir -p build/release",
  # ship the SDL3 shared lib alongside the binary; rpath finds it there
  "{% if os() == 'macos' %}cp -a $SDL_DIR/libSDL3*.dylib build/release/{% elif os() == 'windows' %}cp $SDL_DIR/SDL3*.dll build/release/{% else %}cp -a $SDL_DIR/libSDL3*.so* build/release/{% endif %}",
  "odin build source/release -out:build/release/$APP_NAME.bin -extra-linker-flags:\"{% if os() == 'windows' %}/LIBPATH:$SDL_DIR{% elif os() == 'macos' %}-L$PWD/$SDL_DIR -Wl,-rpath,@loader_path -sectcreate __TEXT __info_plist Info.plist{% else %}-L$PWD/$SDL_DIR -Wl,-rpath=\\$ORIGIN{% endif %}\" -strict-style -vet -no-bounds-check -o:speed",
  "cp -R resources build/release/",
]

[tasks.stop]
description = "Kill the running hot-reload app and clean up per-reload DLL copies"
run = '''
pkill -f "$EXE" || true
rm -f "$HR_OUT"/${APP_NAME}_[0-9]*$DLL_EXT
'''
